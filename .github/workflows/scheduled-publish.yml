# Publishes blog posts on their 更新日: merges every open PR labelled
# `publish-YYYY-MM-DD` once that date has arrived in Japan time.
#
# To schedule a PR:
#   gh label create publish-2026-11-27 --color 0E8A16 --force
#   gh api -X POST repos/samusimitar/tengu-sapporo/issues/<number>/labels -f "labels[]=publish-2026-11-27"
#
# A PR whose date has passed (e.g. a missed run) is merged on the next run.
# If a merge fails (conflict, etc.) the label stays, the run fails and GitHub
# emails the repo owner; the next run tries again.
#
# Merges are made as github-actions[bot] unless a repository secret
# MERGE_TOKEN holds a samusimitar token (fine-grained: Contents and Pull
# requests read/write on this repo), in which case they are made as samusimitar.

name: Scheduled publish

on:
  schedule:
    - cron: "5 15 * * *" # 00:05 JST (off the top of the hour, when GitHub drops runs)
    - cron: "0 21 * * *" # 06:00 JST, catches a delayed or dropped midnight run
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be merged"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  pages: write

concurrency: scheduled-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.MERGE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Merge PRs whose publish date has arrived
        id: merge
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          echo "Today in Japan: $today"
          scheduled=$(gh pr list --state open --limit 100 --json number,labels \
            --jq '.[] | .number as $n | .labels[].name | select(startswith("publish-")) | "\($n) \(.)"')
          merged=0
          failed=0
          while read -r pr label; do
            [ -n "$pr" ] || continue
            date=${label#publish-}
            if ! [[ $date =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::warning::PR #$pr has label '$label'; expected publish-YYYY-MM-DD"
              continue
            fi
            if [[ $date > $today ]]; then
              echo "PR #$pr waits until $date"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: would merge PR #$pr ($label)"
              continue
            fi
            if gh pr merge "$pr" --merge < /dev/null; then
              echo "Merged PR #$pr ($label)"
              merged=$((merged + 1))
            else
              echo "::error::Could not merge PR #$pr ($label)"
              failed=$((failed + 1))
            fi
          done <<< "$scheduled"
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          [ "$failed" -eq 0 ]

      # Merges made with the built-in token don't always start a Pages build,
      # so request one if the site hasn't started building the new main.
      - name: Make sure GitHub Pages rebuilds
        if: ${{ !cancelled() && steps.merge.outputs.merged != '' && steps.merge.outputs.merged != '0' }}
        run: |
          set -euo pipefail
          sleep 60
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          built=$(gh api "repos/$GH_REPO/pages/builds/latest" --jq .commit || true)
          if [ "$built" = "$head" ]; then
            echo "Pages is already building $head"
          else
            gh api -X POST "repos/$GH_REPO/pages/builds" --jq .status
          fi
